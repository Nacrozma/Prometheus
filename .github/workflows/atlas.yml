# Checks and unsigned builds for ATLAS Co-Pilot on Linux, Windows and macOS.
name: atlas
on:
  push:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  pull_request:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: atlas/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --workspace
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.os }}
          path: |
            atlas/target/release/bundle/**/*.deb
            atlas/target/release/bundle/**/*.AppImage
            atlas/target/release/bundle/**/*.msi
            atlas/target/release/bundle/**/*.exe
            atlas/target/release/bundle/**/*.dmg
          if-no-files-found: warn
