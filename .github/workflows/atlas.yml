# ATLAS Co-Pilot: checks, desktop end-to-end tests and unsigned builds.
name: atlas
on:
  push:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  pull_request:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: atlas/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --workspace
      - name: OS credential store round-trip (Windows Credential Manager)
        if: runner.os == 'Windows'
        run: cargo test -p atlas-core --lib os_keyring -- --ignored
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.os }}
          path: |
            atlas/target/release/bundle/**/*.deb
            atlas/target/release/bundle/**/*.AppImage
            atlas/target/release/bundle/**/*.msi
            atlas/target/release/bundle/**/*.exe
            atlas/target/release/bundle/**/*.dmg
          if-no-files-found: warn

  # Drives the real desktop app over WebDriver (tauri-driver) with the scripted e2e provider.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: atlas
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $ver"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          try { Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile $zip }
          catch { Invoke-WebRequest "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip" -OutFile $zip }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: atlas/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
          key: e2e
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Build the e2e desktop binary
        run: pnpm tauri build --debug --no-bundle --features e2e
      # Independent of WebDriver: launch the app, confirm it stays up, and capture the real Windows desktop.
      - name: Windows launch smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shots = "$env:RUNNER_TEMP\screenshots"; New-Item -ItemType Directory -Force $shots | Out-Null
          $env:ATLAS_DATA_DIR = "$env:RUNNER_TEMP\smoke-data"
          $p = Start-Process -FilePath "target\debug\atlas-desktop.exe" -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\smoke.out" -RedirectStandardError "$env:RUNNER_TEMP\smoke.err"
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$shots\00-windows-launch.png")
          Get-Content "$env:RUNNER_TEMP\smoke.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.HasExited) { Write-Error "Atlas exited during startup with code $($p.ExitCode)"; exit 1 }
          Write-Host "Atlas is running after 15 s (pid $($p.Id)); WebView2 processes: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          Stop-Process -Id $p.Id -Force
      - name: Desktop end-to-end tests
        run: SKIP_BUILD=1 ATLAS_SCREENSHOTS="$RUNNER_TEMP/screenshots" ATLAS_FAILSHOTS="$RUNNER_TEMP/failures" tests/e2e/run.sh
      - name: WebView2 automation diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content "$env:TEMP\atlas-e2e-startup.txt" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/failures
          if-no-files-found: ignore
