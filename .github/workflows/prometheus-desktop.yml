# Prometheus Desktop for Windows: run the test suite on Windows, build the app with PyInstaller, build
# the installer with Inno Setup, then check it on a real Windows VM: the packaged app starts (self-test),
# its child-Python mode works, a silent per-user install works, an upgrade over an older build keeps
# the user's data, and uninstalling removes the program but keeps the data.
# The installer is uploaded as a workflow artifact only. Nothing is published as a release.
name: prometheus-desktop
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "packaging/**"
      - "prometheus.py"
      - "gui_*.py"
      - "tests/**"
      - ".github/workflows/prometheus-desktop.yml"

permissions:
  contents: read

env:
  APP_VERSION: "0.1.0"

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (no Whisper/PyTorch)
        run: pip install openai python-dotenv psutil Pillow PyQt6 PyOpenGL numpy sounddevice soundfile edge-tts keyring pytest
      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -p no:cacheprovider

  build-and-verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: pip install openai python-dotenv psutil Pillow PyQt6 PyOpenGL numpy sounddevice soundfile edge-tts keyring pyinstaller

      - name: Build the app (PyInstaller, one folder)
        run: |
          $ErrorActionPreference = 'Stop'
          python packaging/make_icon.py packaging/prometheus.ico
          pyinstaller packaging/prometheus.spec --noconfirm --distpath dist --workpath build
          if (-not (Test-Path dist\Prometheus\Prometheus.exe)) { throw "no exe" }
          # No personal state or keys may be in the bundle.
          $bad = Get-ChildItem -Recurse dist\Prometheus -Include .env,memory.json,memory_graph.json,audit.jsonl,session.json,prometheus_config.json,desktop_settings.json,skills.json -File
          if ($bad) { $bad | ForEach-Object { $_.FullName }; throw "personal state found in the bundle" }

      - name: Packaged app self-test (throwaway folders)
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PROMETHEUS_HOME = "$env:RUNNER_TEMP\st-home"; $env:PROMETHEUS_WORKSPACE = "$env:RUNNER_TEMP\st-ws"
          $p = Start-Process dist\Prometheus\Prometheus.exe -ArgumentList "--self-test=$env:RUNNER_TEMP\selftest-folder.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest-folder.json"
          if ($p.ExitCode -ne 0) { throw "self-test exit $($p.ExitCode)" }
          # The core's child processes (run_code, Forge tests) call the executable as Python.
          Set-Content "$env:RUNNER_TEMP\child.py" 'import sys, json; open(sys.argv[1], "w").write(json.dumps({"ok": True, "py": sys.version.split()[0]}))'
          $c = Start-Process dist\Prometheus\Prometheus.exe -ArgumentList "-I","$env:RUNNER_TEMP\child.py","$env:RUNNER_TEMP\child.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\child.json"
          if ($c.ExitCode -ne 0 -or -not (Get-Content "$env:RUNNER_TEMP\child.json" | Select-String '"ok": true')) { throw "child python mode failed" }

      - name: Build installers (an older build to upgrade from, and this version)
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp /DAppVersion=0.0.9 packaging\prometheus.iss
          & $iscc /Qp /DAppVersion=$env:APP_VERSION packaging\prometheus.iss
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Install, upgrade with data kept, uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:LOCALAPPDATA\Programs\Prometheus"
          $data = "$env:APPDATA\Prometheus"
          # 1) fresh install of the older build
          $p = Start-Process "dist\Prometheus-Setup-0.0.9-x64-unsigned.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$app\Prometheus.exe")) { throw "install failed" }
          $s = Start-Process "$app\Prometheus.exe" -ArgumentList "--self-test=$env:RUNNER_TEMP\selftest-installed-old.json" -Wait -PassThru
          if ($s.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\selftest-installed-old.json"; throw "installed self-test failed" }
          if (-not (Test-Path "$data\prometheus.log")) { Get-ChildItem $data -ErrorAction SilentlyContinue; throw "data folder not used in %APPDATA%" }
          if (Test-Path "$app\prometheus.log") { throw "the app wrote state into its program folder" }
          # 2) user data the upgrade must keep
          Set-Content "$data\upgrade-marker.txt" "keep me"
          # 3) upgrade in place
          $p = Start-Process "dist\Prometheus-Setup-$env:APP_VERSION-x64-unsigned.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade failed" }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like "Prometheus*"
          if (@($reg).Count -ne 1 -or $reg.DisplayVersion -ne $env:APP_VERSION) { $reg | Format-List; throw "expected one Prometheus $env:APP_VERSION entry" }
          if ((Get-Content "$data\upgrade-marker.txt") -ne "keep me") { throw "data lost on upgrade" }
          $s = Start-Process "$app\Prometheus.exe" -ArgumentList "--self-test=$env:RUNNER_TEMP\selftest-installed.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest-installed.json"
          if ($s.ExitCode -ne 0) { throw "self-test after upgrade failed" }
          # 4) uninstall: program removed, data kept
          & "$app\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path "$app\Prometheus.exe") { throw "program still present after uninstall" }
          if (-not (Test-Path "$data\upgrade-marker.txt")) { throw "uninstall removed user data" }
          "install / upgrade / uninstall: OK"

      - name: Size and checksum
        run: |
          $f = Get-Item "dist\Prometheus-Setup-$env:APP_VERSION-x64-unsigned.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Set-Content "dist\SHA256SUMS.txt"
          "Installer: $($f.Name)  $([math]::Round($f.Length/1MB,1)) MB  sha256 $h" | Tee-Object -FilePath "dist\build-report.txt"
          "Installed folder: $([math]::Round(((Get-ChildItem -Recurse dist\Prometheus | Measure-Object Length -Sum).Sum)/1MB,1)) MB" | Tee-Object -Append -FilePath "dist\build-report.txt"
          Copy-Item "$env:RUNNER_TEMP\selftest-*.json" dist\

      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-desktop-windows-x64-unsigned
          path: |
            dist/Prometheus-Setup-${{ env.APP_VERSION }}-x64-unsigned.exe
            dist/SHA256SUMS.txt
            dist/build-report.txt
            dist/selftest-*.json
          retention-days: 14
