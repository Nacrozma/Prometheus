[package]
name = "atlas-desktop"
description = "ATLAS Co-Pilot desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Builds used by automated end-to-end tests: adds a deterministic scripted provider.
e2e = ["atlas-core/test-support"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
async-trait = "0.1.92"
atlas-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["sync"] }
tokio-util = "0.7.20"
